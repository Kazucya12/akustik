                      int skip = Notification.FLAG_ONGOING_EVENT | Notification.FLAG_FOREGROUND_SERVICE | Notification.FLAG_GROUP_SUMMARY;
                      if ((n.flags & skip) != 0) {
                          return;
                      }
                      RankingMap rm = getCurrentRanking();
                      Ranking r = new Ranking();
                      if (rm != null && rm.getRanking(sbn.getKey(), r) && r.getImportance() < NotificationManager.IMPORTANCE_HIGH) {
                          return;
                      }
                      FloatLyric.suppress(6500L);
                  } catch (Exception e) {
                      // abaikan
                  }
              }
          }
