          cat > android/app/src/main/java/com/loopify/app/FloatLyric.java <<'LOOPIFY_EOF'
          package com.loopify.app;

          import android.app.KeyguardManager;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.util.DisplayMetrics;
          import android.graphics.Outline;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewOutlineProvider;
          import android.view.WindowManager;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /**
           * Pil lirik mengambang di atas aplikasi lain dan game (gaya Dynamic Island).
           * Saat lagu ganti: judul + artis selama beberapa detik, lalu satu baris lirik yang sedang dinyanyikan.
           * Tidak bisa disentuh (sentuhan tembus ke game). Hanya tampil saat Loopify di latar belakang, layar menyala dan tidak terkunci.
           * Butuh izin "Tampil di atas aplikasi lain".
           */
          final class FloatLyric {

              static volatile boolean on = false;
              static volatile boolean appFg = false;
              static volatile long bannerUntil = 0L;
              /** Gaya pil: pos 0=atas tengah, 1=atas kiri, 2=atas kanan, 3=bawah tengah; size 0=kecil, 1=normal, 2=besar; opa 0=solid, 1=80%, 2=60%. */
              static volatile int pos = 0;
              static volatile int size = 1;
              static volatile int opa = 0;
              /** Pil disembunyikan sampai waktu ini (elapsedRealtime) karena ada notifikasi pop-up dari aplikasi lain. */
              static volatile long suppressUntil = 0L;

              private static Context ctx = null;
              private static View view = null;
              private static TextView text = null;
              private static ImageView img = null;
              private static Bitmap shownArt = null;
              private static boolean artSet = false;

              private static final Runnable recheck = new Runnable() {
                  @Override
                  public void run() {
                      if (ctx != null) {
                          refresh(ctx);
                      }
                  }
              };

              private static final Runnable recheckSup = new Runnable() {
                  @Override
                  public void run() {
                      if (ctx != null) {
                          refresh(ctx);
                      }
                  }
              };

              private FloatLyric() {
              }

              /** Ada notifikasi pop-up masuk (dari NotifGuard): sembunyikan pil sebentar supaya tidak saling menimpa. */
              static void suppress(long ms) {
                  suppressUntil = SystemClock.elapsedRealtime() + ms;
                  MainActivity.UI.removeCallbacks(recheckSup);
                  MainActivity.UI.post(recheckSup);
                  MainActivity.UI.postDelayed(recheckSup, ms + 150L);
              }

              /** Lagu baru: tampilkan judul + artis beberapa detik. Aman dipanggil dari thread mana pun. */
              static void banner() {
                  bannerUntil = SystemClock.elapsedRealtime() + 4500L;
                  MainActivity.UI.removeCallbacks(recheck);
                  MainActivity.UI.postDelayed(recheck, 4600L);
              }

              private static String want() {
                  if (!on || appFg || !MusicService.running || !MusicService.playing) {
                      return null;
                  }
                  if (!Settings.canDrawOverlays(ctx)) {
                      return null;
                  }
                  if (SystemClock.elapsedRealtime() < suppressUntil) {
                      return null;
                  }
                  KeyguardManager km = ctx.getSystemService(KeyguardManager.class);
                  if (km != null && km.isKeyguardLocked()) {
                      return null;
                  }
                  PowerManager pm = ctx.getSystemService(PowerManager.class);
                  if (pm != null && !pm.isInteractive()) {
                      return null;
                  }
                  if (SystemClock.elapsedRealtime() < bannerUntil) {
                      return MusicService.artist.isEmpty() ? MusicService.title : MusicService.title + " • " + MusicService.artist;
                  }
                  String l = MusicService.lyLine();
                  return l.isEmpty() ? null : l;
              }

              /** Harus dipanggil di thread utama. */
              static void refresh(Context c) {
                  ctx = c.getApplicationContext();
                  String s = null;
                  try {
                      s = want();
                  } catch (Exception e) {
                      s = null;
                  }
                  if (s == null) {
                      hide();
                  } else {
                      show(s);
                  }
              }

              /** Ganti gaya pil (thread utama): pil dibangun ulang dengan gaya baru. */
              static void setStyle(Context c, int p, int s, int o) {
                  ctx = c.getApplicationContext();
                  pos = Math.max(0, Math.min(3, p));
                  size = Math.max(0, Math.min(2, s));
                  opa = Math.max(0, Math.min(2, o));
                  hide();
                  refresh(c);
              }

              private static int dp(float v) {
                  return Math.round(v * ctx.getResources().getDisplayMetrics().density);
              }

              private static void hide() {
                  if (view != null) {
                      try {
                          ctx.getSystemService(WindowManager.class).removeViewImmediate(view);
                      } catch (Exception e) {
                          // abaikan
                      }
                      view = null;
                      text = null;
                      img = null;
                      artSet = false;
                  }
              }

              private static void show(String s) {
                  try {
                      if (view == null) {
                          build();
                      }
                      if (view == null) {
                          return;
                      }
                      if (!s.contentEquals(text.getText())) {
                          text.setText(s);
                      }
                      Bitmap a = MusicService.art;
                      if (!artSet || a != shownArt) {
                          artSet = true;
                          shownArt = a;
                          img.setImageBitmap(a);
                      }
                  } catch (Exception e) {
                      hide();
                  }
              }

              private static void build() {
                  DisplayMetrics dm = ctx.getResources().getDisplayMetrics();
                  LinearLayout row = new LinearLayout(ctx);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  float sc = size == 0 ? 0.85f : (size == 2 ? 1.25f : 1f);
                  row.setPadding(dp(6 * sc), dp(6 * sc), dp(16 * sc), dp(6 * sc));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(opa == 1 ? 0xCC000000 : (opa == 2 ? 0x99000000 : 0xF2000000));
                  bg.setCornerRadius(dp(40));
                  row.setBackground(bg);

                  ImageView iv = new ImageView(ctx);
                  iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  iv.setBackgroundColor(0xFF3A2050);
                  iv.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View v, Outline o) {
                          o.setOval(0, 0, v.getWidth(), v.getHeight());
                      }
                  });
                  iv.setClipToOutline(true);
                  row.addView(iv, new LinearLayout.LayoutParams(dp(30 * sc), dp(30 * sc)));

                  TextView t = new TextView(ctx);
                  t.setTextColor(0xFFFFFFFF);
                  t.setTextSize(14f * sc);
                  t.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  t.setSingleLine(true);
                  t.setEllipsize(TextUtils.TruncateAt.END);
                  t.setMaxWidth(Math.min(Math.round(dm.widthPixels * 0.7f), dp(440 * sc)));
                  LinearLayout.LayoutParams tlp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  tlp.leftMargin = dp(10);
                  row.addView(t, tlp);

                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                  if (pos == 1) {
                      lp.gravity = Gravity.TOP | Gravity.START;
                      lp.x = dp(12);
                  } else if (pos == 2) {
                      lp.gravity = Gravity.TOP | Gravity.END;
                      lp.x = dp(12);
                  } else if (pos == 3) {
                      lp.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
                  } else {
                      lp.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  }
                  // di bawah status bar (HP dengan status bar tebal seperti Infinix/XOS menutupi pil kalau y terlalu kecil)
                  int sb = 0;
                  int rid = ctx.getResources().getIdentifier("status_bar_height", "dimen", "android");
                  if (rid > 0) {
                      sb = ctx.getResources().getDimensionPixelSize(rid);
                  }
                  lp.y = pos == 3 ? dp(96) : sb + dp(6);
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  row.setAlpha(0f);
                  try {
                      ctx.getSystemService(WindowManager.class).addView(row, lp);
                  } catch (Exception e) {
                      return;
                  }
                  row.animate().alpha(1f).setDuration(200).start();
                  view = row;
                  text = t;
                  img = iv;
                  artSet = false;
              }
          }
          LOOPIFY_EOF
          cat > android/app/src/main/java/com/loopify/app/InstallResult.java <<'LOOPIFY_EOF'
          package com.loopify.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;

          import org.json.JSONObject;

          /** Menerima hasil pemasangan dari PackageInstaller (tidak di-export). */
          public class InstallResult extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  int status = i.getIntExtra(PackageInstaller.EXTRA_STATUS, PackageInstaller.STATUS_FAILURE);
                  if (status == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                      Intent confirm = (Intent) i.getParcelableExtra(Intent.EXTRA_INTENT);
                      if (confirm != null) {
                          confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          c.startActivity(confirm);
                      }
                  } else if (status != PackageInstaller.STATUS_SUCCESS) {
                      String raw = i.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE);
                      if (raw == null) {
                          raw = "";
                      }
                      String m;
                      if (status == PackageInstaller.STATUS_FAILURE_INCOMPATIBLE
