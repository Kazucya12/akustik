                  /** Notifikasi sistem dari web (pengingat waktu dengar, rilis baru). false = notifikasi diblokir. */
                  @JavascriptInterface
                  public boolean systemNotify(String title, String body, String tag) {
                      try {
                          long now = android.os.SystemClock.elapsedRealtime();
                          if (now - lastSysNotify < 1500L) {
                              return true; // batasi supaya halaman tidak bisa membanjiri notifikasi
                          }
                          lastSysNotify = now;
                          android.app.NotificationManager nm = getSystemService(android.app.NotificationManager.class);
                          if (nm == null || !nm.areNotificationsEnabled()) {
                              return false;
                          }
                          String t = title == null ? "" : title.trim();
                          if (t.isEmpty()) {
                              t = "Loopify";
                          }
                          if (t.length() > 80) {
                              t = t.substring(0, 80);
                          }
                          String b = body == null ? "" : body.trim();
                          if (b.length() > 240) {
                              b = b.substring(0, 240);
                          }
                          String g = tag == null || tag.isEmpty() ? "loopify" : tag;
                          if (g.length() > 60) {
                              g = g.substring(0, 60);
                          }
                          android.app.Notification.Builder nb;
                          if (Build.VERSION.SDK_INT >= 26) {
                              if (nm.getNotificationChannel(CH_ALERT) == null) {
                                  android.app.NotificationChannel ch = new android.app.NotificationChannel(CH_ALERT, "Pengingat & rilis baru", android.app.NotificationManager.IMPORTANCE_DEFAULT);
                                  ch.setShowBadge(false);
                                  nm.createNotificationChannel(ch);
                              }
                              nb = new android.app.Notification.Builder(MainActivity.this, CH_ALERT);
                          } else {
                              nb = new android.app.Notification.Builder(MainActivity.this);
                          }
                          Intent open = new Intent(MainActivity.this, MainActivity.class)
                                  .setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                          android.app.PendingIntent pi = android.app.PendingIntent.getActivity(MainActivity.this, 21, open,
                                  android.app.PendingIntent.FLAG_IMMUTABLE | android.app.PendingIntent.FLAG_UPDATE_CURRENT);
                          nb.setSmallIcon(R.drawable.ic_stat)
                                  .setContentTitle(t)
                                  .setContentText(b)
                                  .setStyle(new android.app.Notification.BigTextStyle().bigText(b))
                                  .setContentIntent(pi)
                                  .setAutoCancel(true)
                                  .setVisibility(android.app.Notification.VISIBILITY_PRIVATE);
                          nm.notify(g, 4201, nb.build());
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

