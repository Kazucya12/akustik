              /** Perintah dari luar (bagikan tautan, pintasan ikon, mobil/asisten suara); diambil halaman lewat LoopifyNative.takeCmd(). */
              private static String pendingCmd = "";

              static void putCmd(String kind, String arg) {
                  try {
                      org.json.JSONObject o = new org.json.JSONObject();
                      o.put("k", kind);
                      o.put("a", arg == null ? "" : arg);
                      synchronized (MainActivity.class) {
                          pendingCmd = o.toString();
                      }
                  } catch (Exception ignored) {
                  }
              }

              static synchronized String takePending() {
                  String r = pendingCmd;
                  pendingCmd = "";
                  return r;
              }

              /** Dari layanan musik (mobil/Bluetooth): kalau halaman hidup langsung diberi tahu, kalau belum buka aplikasinya. */
              static void queueCmd(Context c, String kind, String arg) {
                  putCmd(kind, arg);
                  if (web != null) {
                      js("try{window.loopifyPoll&&loopifyPoll()}catch(e){}");
                      return;
                  }
                  try {
                      c.startActivity(new Intent(c, MainActivity.class).setAction(A_AUTO).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                  } catch (Exception ignored) {
                  }
              }

              private void handleIntent(Intent in) {
                  if (in == null || in.getAction() == null) {
                      return;
                  }
                  String a = in.getAction();
                  String kind = null;
                  String arg = null;
                  if (Intent.ACTION_SEND.equals(a)) {
                      CharSequence t = in.getCharSequenceExtra(Intent.EXTRA_TEXT);
                      if (t != null && t.length() > 0) {
                          kind = "share";
                          arg = t.length() > 2000 ? t.subSequence(0, 2000).toString() : t.toString();
                      }
                  } else if (Intent.ACTION_VIEW.equals(a) && in.getData() != null) {
                      kind = "view";
                      arg = in.getDataString();
                  } else if (A_SHORTCUT.equals(a)) {
                      kind = "shortcut";
                      arg = in.getStringExtra("cmd");
                  } else if (A_PLAY_SEARCH.equals(a)) {
                      kind = "search";
                      arg = in.getStringExtra(android.app.SearchManager.QUERY);
                  }
                  if (kind != null) {
                      putCmd(kind, arg);
                  }
                  setIntent(new Intent(Intent.ACTION_MAIN)); // jangan diproses ulang
                  if (web != null) {
                      js("try{window.loopifyPoll&&loopifyPoll()}catch(e){}");
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  handleIntent(intent);
              }

