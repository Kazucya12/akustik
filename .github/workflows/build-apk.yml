                  boolean ok = clientUid == android.os.Process.myUid() || clientUid == android.os.Process.SYSTEM_UID
                          || getPackageName().equals(clientPackageName);
                  for (int i = 0; !ok && i < TRUSTED.length; i++) {
                      ok = TRUSTED[i].equals(clientPackageName);
                  }
                  return ok ? new BrowserRoot(ROOT, null) : null;
              }

              @Override
              public void onLoadChildren(String parentId, Result<List<MediaBrowser.MediaItem>> result) {
                  List<MediaBrowser.MediaItem> out = new ArrayList<>();
                  try {
                      JSONObject l = library();
                      if (ROOT.equals(parentId)) {
                          out.add(item("cmd:resume", "Lanjutkan", "Putar lagi yang terakhir", false));
                          out.add(item("cmd:shuffle", "Acak Favorit", "Putar Favorit secara acak", false));
                          JSONArray f = l.optJSONArray("fav");
                          JSONArray h = l.optJSONArray("hist");
                          out.add(item("fav", "Favorit", (f == null ? 0 : f.length()) + " lagu", true));
                          out.add(item("hist", "Terakhir diputar", (h == null ? 0 : h.length()) + " lagu", true));
                      } else if ("fav".equals(parentId) || "hist".equals(parentId)) {
                          JSONArray a = l.optJSONArray(parentId);
                          for (int i = 0; a != null && i < a.length() && i < 100; i++) {
                              JSONObject o = a.optJSONObject(i);
                              if (o != null) {
                                  out.add(item(parentId + ":" + i, o.optString("t", "Lagu"), o.optString("a", ""), false));
                              }
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  result.sendResult(out);
              }
