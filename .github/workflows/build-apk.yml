              /** Membaca daftar musik dari MediaStore, lalu mengirimnya ke halaman (window.x38done). */
              private void doScan() {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          JSONArray arr = new JSONArray();
                          Cursor c = null;
                          try {
                              c = getContentResolver().query(
                                      MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                                      new String[]{MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE,
                                              MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.DURATION},
                                      "(" + MediaStore.Audio.Media.IS_MUSIC + "!=0 AND " + MediaStore.Audio.Media.DURATION + ">=30000)"
                                              + " OR (" + MediaStore.Audio.Media.IS_RINGTONE + "=0 AND " + MediaStore.Audio.Media.IS_ALARM + "=0 AND "
                                              + MediaStore.Audio.Media.IS_NOTIFICATION + "=0 AND " + MediaStore.Audio.Media.DURATION + ">=90000"
                                              + (Build.VERSION.SDK_INT >= 29 ? " AND " + MediaStore.Audio.Media.RELATIVE_PATH + " NOT LIKE '%WhatsApp%' AND "
                                              + MediaStore.Audio.Media.RELATIVE_PATH + " NOT LIKE '%Recordings%' AND " + MediaStore.Audio.Media.RELATIVE_PATH + " NOT LIKE '%Telegram%'" : "")
                                              + ")",
                                      null, MediaStore.Audio.Media.DATE_ADDED + " DESC");
                              if (c != null) {
                                  while (c.moveToNext()) {
                                      JSONObject o = new JSONObject();
                                      o.put("i", c.getLong(0));
                                      o.put("t", c.getString(1));
                                      o.put("a", c.getString(2));
                                      o.put("d", c.getLong(3));
                                      arr.put(o);
                                  }
                              }
                          } catch (Exception e) {
                              // izin ditolak atau MediaStore bermasalah: kirim daftar kosong
                          } finally {
                              if (c != null) {
                                  c.close();
                              }
                          }
                          js("window.x38done&&x38done(" + arr.toString() + ")");
                      }
                  }).start();
              }

              /** Menyajikan file musik perangkat sebagai https://situs/__local/ID (mendukung Range supaya bisa seek). */
              private WebResourceResponse serve(Uri u, Map<String, String> hd) {
                  String path = u.getPath();
                  String uh = u.getHost();
                  if (uh == null || !uh.equals(host)) {
                      return null;
                  }
                  if ("/__local/boot".equals(path)) {
                      return bootPage();
                  }
                  if (path == null || !path.startsWith("/__local/")) {
                      return bundled(path);
                  }
                  try {
                      long id = Long.parseLong(path.substring(9));
                      Uri uri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id);
                      AssetFileDescriptor afd = getContentResolver().openAssetFileDescriptor(uri, "r");
                      if (afd == null) {
                          return err(404);
                      }
                      long len = afd.getLength();
                      String mime = getContentResolver().getType(uri);
                      if (mime == null || !mime.startsWith("audio/")) {
                          mime = "audio/mpeg";
                      }
                      Map<String, String> h = new HashMap<String, String>();
                      h.put("Accept-Ranges", "bytes");
                      h.put("Cache-Control", "no-store");
                      String rg = null;
                      if (hd != null) {
                          rg = hd.get("Range");
                          if (rg == null) {
                              rg = hd.get("range");
                          }
                      }
                      FileInputStream fis = afd.createInputStream();
                      if (rg != null && rg.startsWith("bytes=") && len > 0) {
                          String[] p = rg.substring(6).split("-", 2);
                          long s;
                          long e;
                          if (p[0].isEmpty()) {
                              long sx = Long.parseLong(p[1]);
                              s = Math.max(0, len - sx);
                              e = len - 1;
                          } else {
                              s = Long.parseLong(p[0]);
                              e = (p.length > 1 && !p[1].isEmpty()) ? Long.parseLong(p[1]) : len - 1;
                          }
                          if (e >= len) {
                              e = len - 1;
                          }
                          if (s > e) {
                              fis.close();
                              return err(416);
                          }
                          long sk = s;
                          while (sk > 0) {
                              long k = fis.skip(sk);
                              if (k <= 0) {
                                  break;
                              }
                              sk -= k;
                          }
                          h.put("Content-Range", "bytes " + s + "-" + e + "/" + len);
                          h.put("Content-Length", String.valueOf(e - s + 1));
                          return new WebResourceResponse(mime, null, 206, "Partial Content", h, new Lim(fis, e - s + 1));
                      }
                      if (len >= 0) {
                          h.put("Content-Length", String.valueOf(len));
                      }
                      return new WebResourceResponse(mime, null, 200, "OK", h, fis);
                  } catch (Exception ex) {
                      return err(404);
                  }
              }

              /** Halaman pembersih sekali jalan: hapus service worker + cache lama (cache-first) supaya isi dari APK langsung dipakai. */
              private WebResourceResponse bootPage() {
                  String html = "<!doctype html><meta charset=utf-8><body style=\"background:#060928\"><script>"
                          + "(function(){var d=0;function go(){if(d)return;d=1;try{LoopifyNative.bootDone()}catch(e){}location.replace('/')}"
                          + "setTimeout(go,2500);var p=[];"
                          + "try{if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}))}catch(e){}"
                          + "try{if(window.caches)p.push(caches.keys().then(function(k){return Promise.all(k.filter(function(n){return n!=='ma-fol'}).map(function(n){return caches.delete(n)}))}))}catch(e){}"
                          + "Promise.all(p).then(go,go)})();"
                          + "</script>";
                  Map<String, String> h = new HashMap<String, String>();
                  h.put("Cache-Control", "no-store");
                  return new WebResourceResponse("text/html", "utf-8", 200, "OK", h,
                          new ByteArrayInputStream(html.getBytes(java.nio.charset.Charset.forName("UTF-8"))));
              }

              /** Berkas situs yang dibundel di dalam APK (assets/www). Selain itu (mis. /api/...) tetap lewat jaringan seperti biasa. */
              private WebResourceResponse bundled(String path) {
                  if (path == null || path.isEmpty() || path.equals("/")) {
                      path = "/index.html";
                  }
                  if (path.startsWith("/api/") || path.contains("..") || path.endsWith("/")) {
                      return null;
                  }
                  try {
                      InputStream in = getAssets().open("www" + path);
                      String mime = mimeOf(path.substring(path.lastIndexOf('/') + 1));
                      boolean text = mime.startsWith("text/") || mime.endsWith("json");
                      Map<String, String> h = new HashMap<String, String>();
                      h.put("Cache-Control", "no-cache");
                      return new WebResourceResponse(mime, text ? "utf-8" : null, 200, "OK", h, in);
                  } catch (IOException e) {
                      return null;
                  }
              }

              private static String mimeOf(String name) {
                  String n = name.toLowerCase();
                  if (n.endsWith(".html")) {
                      return "text/html";
                  }
                  if (n.endsWith(".js")) {
                      return "text/javascript";
                  }
                  if (n.endsWith(".css")) {
                      return "text/css";
                  }
                  if (n.endsWith(".json")) {
                      return "application/json";
                  }
                  if (n.endsWith(".png")) {
                      return "image/png";
                  }
                  if (n.endsWith(".jpg") || n.endsWith(".jpeg")) {
                      return "image/jpeg";
                  }
                  if (n.endsWith(".svg")) {
                      return "image/svg+xml";
                  }
                  if (n.endsWith(".webp")) {
                      return "image/webp";
                  }
                  if (n.endsWith(".ico")) {
                      return "image/x-icon";
                  }
                  if (n.endsWith(".woff2")) {
                      return "font/woff2";
                  }
                  return "application/octet-stream";
              }

              private static WebResourceResponse err(int code) {
                  return new WebResourceResponse("text/plain", "utf-8", code,
                          code == 416 ? "Range Not Satisfiable" : "Not Found",
                          new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
              }

              /** Aliran yang dibatasi sejumlah byte (untuk respons 206). */
              static class Lim extends FilterInputStream {
                  private long left;

                  Lim(InputStream in, long n) {
                      super(in);
                      left = n;
                  }

                  @Override
                  public int read() throws IOException {
                      if (left <= 0) {
                          return -1;
                      }
                      int b = super.read();
                      if (b >= 0) {
                          left--;
                      }
                      return b;
                  }

                  @Override
                  public int read(byte[] b, int o, int l) throws IOException {
                      if (left <= 0) {
                          return -1;
                      }
                      int n = super.read(b, o, (int) Math.min((long) l, left));
                      if (n > 0) {
                          left -= n;
                      }
                      return n;
                  }
              }

