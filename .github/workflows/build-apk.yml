          package com.loopify.app;

          import android.app.job.JobInfo;
          import android.app.job.JobParameters;
          import android.app.job.JobScheduler;
          import android.app.job.JobService;
          import android.content.ComponentName;
          import android.content.Context;

          /** Cek pembaruan berkala di latar belakang (tiap ±12 jam, bertahan setelah restart HP). */
          public class UpdateJob extends JobService {
              static final int ID = 5901;

              static void schedule(Context c) {
                  JobScheduler js = (JobScheduler) c.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                  if (js == null) {
                      return;
                  }
                  for (JobInfo j : js.getAllPendingJobs()) {
                      if (j.getId() == ID) {
                          return;
                      }
                  }
                  JobInfo info = new JobInfo.Builder(ID, new ComponentName(c, UpdateJob.class))
                          .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                          .setPeriodic(12L * 60L * 60L * 1000L)
                          .setPersisted(true)
                          .build();
                  js.schedule(info);
              }

              @Override
              public boolean onStartJob(final JobParameters p) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Updater.checkAndNotify(getApplicationContext());
                          } catch (Exception ignored) {
                          } finally {
                              jobFinished(p, false);
                          }
                      }
                  }).start();
                  return true;
              }

              @Override
              public boolean onStopJob(JobParameters p) {
                  return false;
              }
          }
