# Membuat Loopify.apk (pembungkus Android native dengan foreground service musik).
# Cara pakai: simpan file ini di repo GitHub-mu dengan nama .github/workflows/build-apk.yml
# Build jalan otomatis. Hasilnya ada di tab Releases (Loopify.apk) dan di Actions > Artifacts.
# Ikon aplikasi diambil dari file apk-icon.png di folder utama repo (upload dulu sebelum build).
# Ganti APP_URL di bawah kalau alamat situsmu berbeda (harus diakhiri tanda /).
name: Build Loopify APK

on:
  workflow_dispatch:
  push:
    paths:
      # Setiap perubahan situs (file di folder utama) membuat APK baru, karena isi situs dibundel di dalam APK.
      - '.github/workflows/build-apk.yml'
      - 'apk-icon.png'
      - 'index.html'
      - 'manifest.json'
      - 'sw-apk.js'
      - 'build.js'
      - '*.js'
      - '*.css'
      - 'icon-*.png'
      - 'android/**'
      - 'og.png'

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_URL: https://loopify1.vercel.app/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Siapkan situs untuk dibundel ke APK
        run: |
          set -e
          # Bundel loopify.js/css dibuat ulang supaya APK selalu memuat versi terbaru walau lupa commit hasil build.
          node build.js
          W=android/app/src/main/assets/www
          mkdir -p "$W"
          cp index.html manifest.json loopify.js loopify.css sw-apk.js "$W"/
          cp ./*.png "$W"/
          # Di APK, service worker memakai sw-apk.js (tanpa cache) supaya isi tidak pernah basi.
          n=$(grep -o "navigator.serviceWorker.register('sw.js')" "$W/loopify.js" | wc -l)
          if [ "$n" != "1" ]; then echo "Gagal: pendaftaran service worker di loopify.js ditemukan $n kali (seharusnya 1)."; exit 1; fi
          sed -i "s|navigator.serviceWorker.register('sw.js')|navigator.serviceWorker.register('sw-apk.js')|" "$W/loopify.js"
          grep -q "register('sw-apk.js')" "$W/loopify.js"
          ls -la "$W" | head -30
          du -sh "$W"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Terima lisensi Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Siapkan proyek Android
        run: |
          # Kode Android (Java, XML, Gradle) ada di folder android/ di repo; step ini hanya menyiapkan keystore, ikon, dan versi.
          set -e
          test -f android/app/build.gradle || { echo "Folder android/ belum ada di repo (isinya dulu ada di workflow ini). Upload folder android/ sebelum build."; exit 1; }
          mkdir -p android/app/src/main/java/com/loopify/app android/app/src/main/res/drawable android/app/src/main/res/drawable-nodpi android/app/src/main/res/mipmap-anydpi android/app/src/main/res/layout android/app/src/main/res/xml
          echo '' | base64 -d > android/app/loopify.jks
          sed -i "s|__URL__|$APP_URL|; s|__REPO__|$GITHUB_REPOSITORY|; s|__VC__|$GITHUB_RUN_NUMBER|g" android/app/build.gradle
          test -f apk-icon.png || { echo "File apk-icon.png belum ada di repo. Upload dulu ke folder utama repo."; exit 1; }
          cp apk-icon.png android/app/src/main/res/drawable-nodpi/ic_launcher_fg.png
          for k in asli biru hijau pink merah neon mono; do
            # Cari ikon varian: icon-$k.png di folder utama, atau apk-icons/$k.png. Kalau tidak ada, pakai apk-icon.png supaya build tidak gagal.
            src=apk-icon.png
            if [ -f "icon-$k.png" ]; then src="icon-$k.png"; elif [ -f "apk-icons/$k.png" ]; then src="apk-icons/$k.png"; else echo "Peringatan: ikon varian '$k' tidak ditemukan, memakai apk-icon.png"; fi
            cp "$src" android/app/src/main/res/drawable-nodpi/ic_launcher_fg_$k.png
            printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@android:color/black" />\n    <foreground android:drawable="@drawable/ic_launcher_fg_%s" />\n</adaptive-icon>\n' "$k" > android/app/src/main/res/mipmap-anydpi/ic_launcher_$k.xml
          done
          ls -R android | head -40

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Loopify.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Loopify-APK
          path: Loopify.apk

      - name: Rilis (unduhan langsung)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Loopify APK ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Loopify.apk
