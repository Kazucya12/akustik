          cat > android/app/src/main/java/com/loopify/app/Updater.java <<'LOOPIFY_EOF'
          package com.loopify.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageInstaller;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /**
           * Pembaruan APK lewat GitHub Releases (tag "apk-N", berkas Loopify.apk, N = versionCode).
           * Alamat unduhan TIDAK pernah datang dari halaman web: aplikasi mengambilnya sendiri dari repo
           * yang ditanam saat build (BuildConfig.UPDATE_REPO), jadi halaman web hanya bisa meminta "periksa" dan "pasang".
           * Keamanan akhir dijaga Android: APK baru hanya bisa menimpa kalau ditandatangani dengan kunci yang sama.
           */
          final class Updater {
              static final String CH = "loopify_update";
              static final String ASSET = "Loopify.apk";

              static final class Info {
                  int code;
                  String name = "";
                  String url = "";
                  String sha = "";
                  String notes = "";
                  long size;
              }

              private static volatile boolean busy = false;
              private static volatile Info latest = null;

              private Updater() {
              }

              static int installedCode(Context c) {
                  try {
                      PackageInfo p = c.getPackageManager().getPackageInfo(c.getPackageName(), 0);
                      if (Build.VERSION.SDK_INT >= 28) {
                          return (int) p.getLongVersionCode();
                      }
                      return p.versionCode;
                  } catch (Exception e) {
                      return 0;
                  }
              }

              static String installedName(Context c) {
                  try {
                      String n = c.getPackageManager().getPackageInfo(c.getPackageName(), 0).versionName;
                      return n == null ? "" : n;
                  } catch (Exception e) {
                      return "";
                  }
              }

              private static String readAll(InputStream in, int max) throws Exception {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) {
                      bo.write(buf, 0, n);
                      if (bo.size() > max) {
                          throw new Exception("Respons terlalu besar");
                      }
                  }
                  return bo.toString("UTF-8");
              }

              /** Cadangan tanpa API: rilis APK terbaru dari feed publik (nomor tag apk-N tertinggi). Ukuran dan sha tidak tersedia di sini (keduanya opsional). */
              static Info fetchFromFeed(String repo) throws Exception {
                  HttpURLConnection h = (HttpURLConnection) new URL("https://github.com/" + repo + "/releases.atom").openConnection();
                  h.setConnectTimeout(15000);
                  h.setReadTimeout(20000);
                  h.setRequestProperty("Accept", "application/atom+xml");
                  h.setRequestProperty("User-Agent", "Loopify-Android");
                  try {
                      int code = h.getResponseCode();
                      if (code != 200) {
                          throw new Exception("GitHub membalas " + code);
                      }
                      String xml = readAll(h.getInputStream(), 2 * 1024 * 1024);
                      Matcher m = Pattern.compile("/" + Pattern.quote(repo) + "/releases/tag/apk-(\\d+)").matcher(xml);
                      int best = -1;
                      while (m.find()) {
                          try {
                              int n = Integer.parseInt(m.group(1));
                              if (n > best) {
                                  best = n;
                              }
                          } catch (Exception e) {
                              // lewati tag yang nomornya tidak valid
                          }
                      }
                      if (best < 0) {
                          return null;
                      }
                      Info f = new Info();
                      f.code = best;
                      f.name = "1.0." + best;
                      f.url = "https://github.com/" + repo + "/releases/download/apk-" + best + "/" + ASSET;
                      return f;
                  } finally {
                      h.disconnect();
                  }
              }

              /** Rilis APK terbaru (nomor tag apk-N tertinggi), atau null kalau belum ada. */
              static Info fetchLatest() throws Exception {
                  String repo = BuildConfig.UPDATE_REPO;
                  if (repo == null || repo.indexOf('/') <= 0 || repo.startsWith("__")) {
                      throw new Exception("Alamat repo pembaruan belum diatur");
                  }
                  HttpURLConnection h = (HttpURLConnection) new URL("https://api.github.com/repos/" + repo + "/releases?per_page=20").openConnection();
                  h.setConnectTimeout(15000);
                  h.setReadTimeout(20000);
                  h.setRequestProperty("Accept", "application/vnd.github+json");
                  h.setRequestProperty("User-Agent", "Loopify-Android");
                  try {
                      int code = h.getResponseCode();
                      if (code == 404) {
                          throw new Exception("Rilis tidak ditemukan (repo harus publik)");
                      }
                      if (code == 403 || code == 429) {
                          // API GitHub tanpa login dibatasi 60 permintaan/jam per IP (jaringan seluler berbagi IP, jadi mudah kena).
                          // Cadangan: baca feed rilis publik, yang tidak memakai kuota API.
                          try {
                              return fetchFromFeed(repo);
                          } catch (Exception fe) {
                              throw new Exception("GitHub membatasi permintaan (" + code + ")");
                          }
                      }
                      if (code != 200) {
                          throw new Exception("GitHub membalas " + code);
                      }
                      JSONArray arr = new JSONArray(readAll(h.getInputStream(), 2 * 1024 * 1024));
                      String prefix = "https://github.com/" + repo + "/releases/download/";
                      Info best = null;
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject r = arr.getJSONObject(i);
                          if (r.optBoolean("draft") || r.optBoolean("prerelease")) {
                              continue;
                          }
                          String tag = r.optString("tag_name", "");
                          if (!tag.startsWith("apk-")) {
                              continue;
                          }
                          int n;
                          try {
                              n = Integer.parseInt(tag.substring(4));
                          } catch (Exception e) {
                              continue;
                          }
                          if (best != null && n <= best.code) {
                              continue;
                          }
                          JSONArray as = r.optJSONArray("assets");
                          if (as == null) {
                              continue;
                          }
                          for (int k = 0; k < as.length(); k++) {
                              JSONObject a = as.getJSONObject(k);
                              String url = a.optString("browser_download_url", "");
                              if (ASSET.equals(a.optString("name", "")) && url.startsWith(prefix)) {
                                  Info f = new Info();
                                  f.code = n;
                                  f.name = "1.0." + n;
                                  f.url = url;
                                  f.size = a.optLong("size", 0L);
                                  String d = a.isNull("digest") ? "" : a.optString("digest", "");
                                  if (d.startsWith("sha256:")) {
                                      f.sha = d.substring(7).toLowerCase();
                                  }
                                  String body = r.isNull("body") ? "" : r.optString("body", "");
                                  f.notes = body.length() > 600 ? body.substring(0, 600) : body;
                                  best = f;
                                  break;
                              }
                          }
                      }
                      return best;
                  } finally {
                      h.disconnect();
                  }
              }

              static String msg(Exception e) {
                  String m = e.getMessage();
                  return m == null || m.length() == 0 ? "Terjadi kesalahan" : m;
              }

              /** Dipanggil dari halaman: periksa lalu kirim hasil ke window.x59Res. */
              static void checkAsync(final Context app) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Info n = fetchLatest();
                              int cur = installedCode(app);
                              JSONObject o = new JSONObject();
                              o.put("cur", cur);
                              o.put("curName", installedName(app));
                              if (n != null) {
                                  latest = n;
                                  o.put("code", n.code);
                                  o.put("name", n.name);
                                  o.put("notes", n.notes);
                                  o.put("size", n.size);
                                  o.put("newer", n.code > cur);
                              } else {
                                  o.put("newer", false);
                              }
                              MainActivity.js("window.x59Res&&x59Res(" + o.toString() + ")");
                          } catch (Exception e) {
                              MainActivity.js("window.x59Res&&x59Res({\"error\":" + JSONObject.quote(msg(e)) + "})");
                          }
                      }
                  }).start();
              }

              private static void fail(String m) {
                  MainActivity.js("window.x59Err&&x59Err(" + JSONObject.quote(m) + ")");
              }

              /** Dipanggil dari halaman: unduh APK terbaru lalu pasang. Progres dikirim ke x59Prog / x59Inst / x59Err / x59Perm. */
              static void installAsync(final Context app) {
                  if (busy) {
                      return;
                  }
                  busy = true;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Info n = latest;
                              if (n == null) {
                                  n = fetchLatest();
                              }
                              if (n == null || n.code <= installedCode(app)) {
                                  fail("Kamu sudah memakai versi terbaru");
                                  return;
                              }
                              if (!app.getPackageManager().canRequestPackageInstalls()) {
                                  Intent i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + app.getPackageName()));
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  app.startActivity(i);
                                  MainActivity.js("window.x59Perm&&x59Perm()");
                                  return;
                              }
                              File apk = download(app, n);
                              install(app, apk);
                              MainActivity.js("window.x59Inst&&x59Inst()");
                          } catch (Exception e) {
                              fail(msg(e));
                          } finally {
                              busy = false;
                          }
                      }
                  }).start();
              }

              private static File download(Context c, Info n) throws Exception {
                  File dir = new File(c.getCacheDir(), "update");
                  if (!dir.exists() && !dir.mkdirs()) {
                      throw new Exception("Tidak bisa membuat folder unduhan");
                  }
                  File apk = new File(dir, ASSET);
                  if (apk.exists()) {
                      apk.delete();
                  }
                  HttpURLConnection h = (HttpURLConnection) new URL(n.url).openConnection();
                  h.setConnectTimeout(20000);
                  h.setReadTimeout(30000);
                  h.setRequestProperty("User-Agent", "Loopify-Android");
                  try {
                      int rc = h.getResponseCode();
                      if (rc != 200) {
                          throw new Exception("Unduhan gagal (" + rc + ")");
                      }
                      long total = h.getContentLengthLong();
                      if (total <= 0) {
                          total = n.size;
                      }
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      InputStream in = h.getInputStream();
                      OutputStream out = new FileOutputStream(apk);
                      try {
                          byte[] buf = new byte[65536];
                          long got = 0;
                          int last = -1;
                          int r;
                          while ((r = in.read(buf)) > 0) {
                              out.write(buf, 0, r);
                              md.update(buf, 0, r);
                              got += r;
                              if (total > 0) {
                                  int pct = (int) Math.min(99L, got * 100L / total);
                                  if (pct != last) {
                                      last = pct;
                                      MainActivity.js("window.x59Prog&&x59Prog(" + pct + ")");
                                  }
                              }
                          }
                      } finally {
                          out.close();
                          in.close();
                      }
                      StringBuilder sb = new StringBuilder();
                      for (byte b : md.digest()) {
                          sb.append(String.format("%02x", b));
                      }
                      if (n.sha.length() == 64 && !n.sha.equals(sb.toString())) {
                          apk.delete();
                          throw new Exception("Berkas unduhan tidak cocok (checksum), coba lagi");
                      }
                  } finally {
                      h.disconnect();
                  }
                  // APK Loopify kecil (tanpa pustaka tambahan, di bawah 1 MB), jadi jangan pakai batas 1 MB.
                  // Berkas dianggap lengkap kalau ukurannya sama dengan ukuran aset di GitHub (checksum SHA-256 sudah dicek di atas).
                  if (apk.length() < 100000L || (n.size > 0 && apk.length() != n.size)) {
                      apk.delete();
                      throw new Exception("Berkas unduhan tidak lengkap");
                  }
                  FileInputStream chk = new FileInputStream(apk);
                  try {
                      if (chk.read() != 'P' || chk.read() != 'K') {
                          apk.delete();
                          throw new Exception("Berkas unduhan bukan APK");
                      }
                  } finally {
                      chk.close();
                  }
                  return apk;
              }

              private static void install(Context c, File apk) throws Exception {
                  PackageInstaller pi = c.getPackageManager().getPackageInstaller();
                  PackageInstaller.SessionParams sp = new PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL);
                  sp.setAppPackageName(c.getPackageName());
                  if (Build.VERSION.SDK_INT >= 31) {
                      sp.setRequireUserAction(PackageInstaller.SessionParams.USER_ACTION_NOT_REQUIRED);
                  }
                  int id = pi.createSession(sp);
                  PackageInstaller.Session s = pi.openSession(id);
                  try {
                      InputStream in = new FileInputStream(apk);
                      OutputStream out = s.openWrite(ASSET, 0, apk.length());
                      try {
                          byte[] buf = new byte[65536];
                          int r;
                          while ((r = in.read(buf)) > 0) {
                              out.write(buf, 0, r);
                          }
                          s.fsync(out);
                      } finally {
                          out.close();
                          in.close();
                      }
                      Intent it = new Intent(c, InstallResult.class);
                      int fl = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= 31) {
                          fl |= PendingIntent.FLAG_MUTABLE; // wajib mutable: sistem menambahkan status ke intent ini
                      }
                      PendingIntent pend = PendingIntent.getBroadcast(c, id, it, fl);
                      s.commit(pend.getIntentSender());
                  } catch (Exception e) {
                      s.abandon();
                      throw e;
                  } finally {
                      s.close();
                  }
              }

              /** Dipanggil job berkala: kalau ada versi baru yang belum diberitahukan, tampilkan notifikasi. */
              static void checkAndNotify(Context c) throws Exception {
                  Info n = fetchLatest();
                  if (n == null || n.code <= installedCode(c)) {
                      return;
                  }
                  SharedPreferences sp = c.getSharedPreferences("upd", Context.MODE_PRIVATE);
                  if (sp.getInt("notified", 0) >= n.code) {
                      return;
                  }
                  if (notifyNew(c, n)) {
                      sp.edit().putInt("notified", n.code).apply();
                  }
              }

              private static boolean notifyNew(Context c, Info n) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm == null || !nm.areNotificationsEnabled()) {
                      return false;
                  }
                  if (nm.getNotificationChannel(CH) == null) {
                      nm.createNotificationChannel(new NotificationChannel(CH, "Pembaruan aplikasi", NotificationManager.IMPORTANCE_DEFAULT));
                  }
                  Intent open = new Intent(c, MainActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          .putExtra("x59", 1);
                  PendingIntent pi = PendingIntent.getActivity(c, 59, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification nt = new Notification.Builder(c, CH)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle("Pembaruan Loopify tersedia")
                          .setContentText("Versi " + n.name + " siap dipasang. Ketuk untuk memperbarui.")
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .build();
                  nm.notify("loopify-update", 4202, nt);
                  return true;
              }
          }
