              private void send(String action) {
                  try {
                      startService(MusicService.cmd(this, action));
                  } catch (Exception e) {
                      // abaikan
                  }
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  live = this;
                  IntentFilter f = new IntentFilter();
                  f.addAction(Intent.ACTION_SCREEN_OFF);
                  f.addAction(Intent.ACTION_USER_PRESENT);
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(rx, f, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(rx, f);
                  }
                  render();
                  h.removeCallbacks(tick);
                  h.post(tick);
              }

              @Override
              protected void onStop() {
                  h.removeCallbacks(tick);
                  try {
                      unregisterReceiver(rx);
                  } catch (Exception e) {
                      // abaikan
                  }
                  if (live == this) {
                      live = null;
                  }
                  super.onStop();
                  if (!leaving) {
                      finish();
                  }
              }

              @Override
              public void onBackPressed() {
                  // di layar kunci tombol kembali tidak berbuat apa-apa
              }

              @Override
              public boolean dispatchTouchEvent(MotionEvent e) {
                  int a = e.getActionMasked();
                  if (a == MotionEvent.ACTION_DOWN) {
                      downY = e.getY();
                  }
                  boolean r = super.dispatchTouchEvent(e);
                  if (a == MotionEvent.ACTION_UP && downY - e.getY() > dp(110)) {
                      dismiss();
                  }
                  return r;
              }

              /** Buka kunci layar lalu masuk ke Loopify. */
              private void dismiss() {
                  if (leaving) {
                      return;
                  }
                  leaving = true;
                  final KeyguardManager km = getSystemService(KeyguardManager.class);
                  if (km == null) {
                      finish();
                      return;
                  }
                  km.requestDismissKeyguard(this, new KeyguardManager.KeyguardDismissCallback() {
                      @Override
                      public void onDismissSucceeded() {
                          try {
                              startActivity(new Intent(LockActivity.this, MainActivity.class)
                                      .addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP));
                          } catch (Exception e) {
                              // abaikan
                          }
                          finish();
                      }

                      @Override
                      public void onDismissCancelled() {
                          leaving = false;
                      }

                      @Override
                      public void onDismissError() {
                          leaving = false;
                          finish();
                      }
                  });
              }

              private static String fmt(long ms) {
                  long s = Math.max(0L, ms / 1000L);
                  return (s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
              }

              private void progress() {
                  long d = MusicService.durMs;
                  long p = MusicService.posNow();
                  bar.set(d > 0 ? p / (float) d : 0f);
                  tCur.setText(fmt(p));
                  tDur.setText(d > 0 ? fmt(d) : "--:--");
              }

              void render() {
                  if (!MusicService.running) {
                      finish();
                      return;
                  }
                  title.setText(MusicService.title);
                  artist.setText(MusicService.artist);
                  btnPlay.setImageResource(MusicService.playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play);

                  Bitmap a = MusicService.art;
                  if (!artSet || a != lastArt) {
                      artSet = true;
                      lastArt = a;
                      cover.setImageBitmap(a);
                      if (a != null) {
                          // diperkecil lalu direntangkan = efek buram murah untuk latar
                          bg.setImageBitmap(Bitmap.createScaledBitmap(a, 24, 24, true));
                      } else {
                          bg.setImageDrawable(null);
                      }
                  }

                  String[] lines = MusicService.lines;
                  int idx = MusicService.lyIdx;
                  if (idx < -1) {
                      idx = -1;
                  }
                  for (int s = -2; s <= 2; s++) {
                      String x = "";
                      int k = idx + s;
                      if (lines.length == 0) {
                          if (s == 0) {
                              x = "♪";
                          } else if (s == 1) {
                              x = "Lirik belum tersedia";
                          }
                      } else if (k >= 0 && k < lines.length) {
                          x = lines[k];
                      } else if (k == -1 && s == 0) {
                          x = "♪";
                      }
                      ly[s + 2].setText(x);
                  }
                  progress();
              }

              /** Bilah progres tipis dengan titik penanda. */
              static class Bar extends View {
                  private float p = 0f;
                  private final Paint pa = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final RectF rf = new RectF();

                  Bar(Context c) {
                      super(c);
                  }

                  void set(float v) {
                      float n = Math.max(0f, Math.min(1f, v));
                      if (n != p) {
                          p = n;
                          invalidate();
                      }
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      float w = getWidth();
                      float hh = getHeight();
                      float d = getResources().getDisplayMetrics().density;
                      float th = 4f * d;
                      float cy = hh / 2f;
                      float r = 7f * d;
                      pa.setColor(0x40FFFFFF);
                      rf.set(r, cy - th / 2f, w - r, cy + th / 2f);
                      c.drawRoundRect(rf, th / 2f, th / 2f, pa);
                      float x = r + (w - 2f * r) * p;
                      pa.setColor(0xFFFF7A59);
                      rf.set(r, cy - th / 2f, x, cy + th / 2f);
                      c.drawRoundRect(rf, th / 2f, th / 2f, pa);
                      c.drawCircle(x, cy, r, pa);
                  }
              }
          }
