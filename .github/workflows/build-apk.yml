# Membuat Loopify.apk (pembungkus Android native dengan foreground service musik).
# Cara pakai: simpan file ini di repo GitHub-mu dengan nama .github/workflows/build-apk.yml
# Build jalan otomatis. Hasilnya ada di tab Releases (Loopify.apk) dan di Actions > Artifacts.
# Ikon aplikasi diambil dari file apk-icon.png di folder utama repo (upload dulu sebelum build).
# Ganti APP_URL di bawah kalau alamat situsmu berbeda (harus diakhiri tanda /).
name: Build Loopify APK

on:
  workflow_dispatch:
  push:
    paths:
      # Setiap perubahan situs (file di folder utama) membuat APK baru, karena isi situs dibundel di dalam APK.
      - '.github/workflows/build-apk.yml'
      - 'apk-icon.png'
      - 'index.html'
      - 'manifest.json'
      - 'sw-apk.js'
      - 'build.js'
      - '*.js'
      - '*.css'
      - 'icon-*.png'
      - 'android/**'
      - 'og.png'

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_URL: https://loopify1.vercel.app/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Siapkan situs untuk dibundel ke APK
        run: |
          set -e
          # Bundel loopify.js/css dibuat ulang supaya APK selalu memuat versi terbaru walau lupa commit hasil build.
          node build.js
          W=android/app/src/main/assets/www
          mkdir -p "$W"
          cp index.html manifest.json loopify.js loopify.css sw-apk.js "$W"/
          cp ./*.png "$W"/
          # Di APK, service worker memakai sw-apk.js (tanpa cache) supaya isi tidak pernah basi.
          n=$(grep -o "navigator.serviceWorker.register('sw.js')" "$W/loopify.js" | wc -l)
          if [ "$n" != "1" ]; then echo "Gagal: pendaftaran service worker di loopify.js ditemukan $n kali (seharusnya 1)."; exit 1; fi
          sed -i "s|navigator.serviceWorker.register('sw.js')|navigator.serviceWorker.register('sw-apk.js')|" "$W/loopify.js"
          grep -q "register('sw-apk.js')" "$W/loopify.js"
          ls -la "$W" | head -30
          du -sh "$W"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Terima lisensi Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Siapkan proyek Android
        run: |
          # Kode Android (Java, XML, Gradle) ditulis langsung oleh step ini (satu file, tanpa folder android/ di repo).
          set -e
          mkdir -p android/app/src/main/java/com/loopify/app android/app/src/main/res/values android/app/src/main/res/xml android/app/src/main/res/drawable android/app/src/main/res/drawable-nodpi android/app/src/main/res/mipmap-anydpi android/app/src/main/res/layout android/app/src/main/res/xml
          cat > android/build.gradle <<'LOOPIFY_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          LOOPIFY_EOF
          cat > android/gradle.properties <<'LOOPIFY_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          LOOPIFY_EOF
          cat > android/settings.gradle <<'LOOPIFY_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Loopify'
          include ':app'
          LOOPIFY_EOF
          cat > android/app/build.gradle <<'LOOPIFY_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.loopify.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.loopify.app'
                  minSdk 26
                  targetSdk 34
                  versionCode __VC__
                  versionName '1.0.__VC__'
                  buildConfigField 'String', 'APP_URL', '"__URL__"'
                  buildConfigField 'String', 'UPDATE_REPO', '"__REPO__"'
              }

              buildFeatures {
                  buildConfig true
              }

              signingConfigs {
                  release {
                      storeFile file('loopify.jks')
                      storePassword 'loopify123'
                      keyAlias 'loopify'
                      keyPassword 'loopify123'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
