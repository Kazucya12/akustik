                  Notification n = build();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  } else {
                      startForeground(NID, n);
                  }

                  // Kontrol layar kunci Android 13+ hanya menampilkan judul + artis dari sesi media:
                  // saat ada lirik, judul diisi "Judul - Artis" dan baris artis diisi baris lirik yang sedang dinyanyikan.
                  String ly = curLy();
                  String mTitle = ly.isEmpty() || artist.isEmpty() ? title : title + " \u2022 " + artist;
                  String mArtist = ly.isEmpty() ? artist : "\u266A " + ly;
                  MediaMetadata.Builder mb = new MediaMetadata.Builder()
                          .putString(MediaMetadata.METADATA_KEY_TITLE, mTitle)
                          .putString(MediaMetadata.METADATA_KEY_ARTIST, mArtist)
                          .putString(MediaMetadata.METADATA_KEY_ALBUM, artist);
                  if (durMs > 0) {
                      mb.putLong(MediaMetadata.METADATA_KEY_DURATION, durMs);
                  }
                  if (art != null) {
                      mb.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, art);
                      mb.putBitmap(MediaMetadata.METADATA_KEY_ART, art);
                  }
                  session.setMetadata(mb.build());
                  long nowT = android.os.SystemClock.elapsedRealtime();
                  long posNow = PlaybackState.PLAYBACK_POSITION_UNKNOWN;
                  if (durMs > 0) {
                      posNow = playing ? posMs + (nowT - posAt) : posMs;
                      posNow = Math.max(0L, Math.min(posNow, durMs));
                  }
                  session.setPlaybackState(new PlaybackState.Builder()
                          .setActions(PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE
                                  | PlaybackState.ACTION_PLAY_PAUSE | PlaybackState.ACTION_SKIP_TO_NEXT
                                  | PlaybackState.ACTION_SKIP_TO_PREVIOUS | PlaybackState.ACTION_SEEK_TO
                                  | PlaybackState.ACTION_PLAY_FROM_MEDIA_ID | PlaybackState.ACTION_PLAY_FROM_SEARCH
                                  | PlaybackState.ACTION_STOP)
                          .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED,
                                  posNow, 1f, nowT)
                          .build());

                  LoopifyWidget.refreshAll(this);
                  LockActivity.poke();
                  FloatLyric.refresh(this);
                  h.removeCallbacks(idleStop);
                  if (playing) {
                      if (!wl.isHeld()) {
                          wl.acquire();
                      }
                      if (wfl != null && !wfl.isHeld()) {
                          wfl.acquire();
                      }
                  } else {
                      if (wl.isHeld()) {
                          wl.release();
                      }
                      if (wfl != null && wfl.isHeld()) {
                          wfl.release();
                      }
                      h.postDelayed(idleStop, 10 * 60 * 1000L);
                  }
              }

