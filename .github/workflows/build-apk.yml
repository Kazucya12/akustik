                              .setCategory(Notification.CATEGORY_CALL)
                              .setVisibility(Notification.VISIBILITY_SECRET)
                              .setAutoCancel(true)
                              .setTimeoutAfter(4000)
                              .setFullScreenIntent(pi, true)
