      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Loopify.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Loopify-APK
          path: Loopify.apk

      - name: Rilis (unduhan langsung)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Loopify APK ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Loopify.apk
