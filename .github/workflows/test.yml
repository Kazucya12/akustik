# Uji otomatis tiap push / pull request: build bundel lalu jalankan smoke test (jsdom).
# Simpan sebagai .github/workflows/test.yml. Tidak menyentuh pembuatan APK.
name: Test
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node build.js
      - run: npm test
