<link rel="stylesheet" href="loopify.css"><style id="splash-css">
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--bg,#080b1d);color:var(--tx,#e9ecff);transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-lg{width:108px;height:108px;overflow:visible;opacity:0;transform:scale(.6);animation:spPop .7s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes spPop{to{opacity:1;transform:none}}
#splash .sp-r1,#splash .sp-r2,#splash .sp-pl{transform-box:view-box;transform-origin:60px 60px}
#splash .sp-r1{animation:spSpin 1.5s linear infinite}
#splash .sp-r2{animation:spSpin 2.4s linear infinite reverse}
@keyframes spSpin{to{transform:rotate(360deg)}}
#splash .sp-pl{animation:spBeat 1.2s ease-in-out infinite}
@keyframes spBeat{0%,100%{transform:scale(.92)}50%{transform:scale(1.07)}}
#splash:before{content:"";position:absolute;top:50%;left:50%;width:280px;height:280px;margin:-150px 0 0 -140px;border-radius:50%;background:radial-gradient(circle,var(--p,#ff8a5b),transparent 65%);opacity:.16;animation:spGlow 2.6s ease-in-out infinite}
@keyframes spGlow{0%,100%{transform:scale(.8);opacity:.1}50%{transform:scale(1.15);opacity:.24}}
#splash .sp-n{display:flex;font:700 42px/1.15 Sora,system-ui,sans-serif;letter-spacing:.04em}
#splash .sp-n span{display:inline-block;background:linear-gradient(180deg,var(--p2,#ffb08a),var(--p,#ff8a5b));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:spLetter .7s calc(.25s + var(--i)*.08s) cubic-bezier(.2,.9,.3,1.3) both,spWave 1.8s calc(1.4s + var(--i)*.1s) ease-in-out infinite}
@keyframes spLetter{from{opacity:0;transform:translateY(26px) scale(.6)}to{opacity:1;transform:none}}
@keyframes spWave{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#splash .sp-t{font:600 11px Sora,system-ui,sans-serif;text-transform:uppercase;color:var(--mu,#9aa3e6);opacity:0;letter-spacing:.05em;animation:spTag 1.2s 1.7s ease forwards}
@keyframes spTag{to{opacity:.9;letter-spacing:.3em}}
#splash .sp-b{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom,0px));width:160px;height:3px;border-radius:3px;background:rgba(127,127,160,.25);overflow:hidden}
#splash .sp-b:after{content:"";position:absolute;top:0;left:0;height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,var(--p2,#ffb08a),var(--p,#ff8a5b));transform:scaleX(0);transform-origin:left;animation:spFill 4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes spFill{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#splash .sp-r1,#splash .sp-r2,#splash .sp-pl{animation:none}#splash .sp-lg{animation:none;opacity:1;transform:none}#splash .sp-b:after{animation:none;transform:none}#splash .sp-n span{animation:none;opacity:1}#splash .sp-t{animation:none;opacity:.9;letter-spacing:.3em}#splash:before{animation:none}}
</style>

<input type="file" id="fpl" accept=".json,application/json" hidden onchange="plImp(this.files[0]);this.value=''">

 <script src="loopify.js"></script><script>
(function(){var s=document.getElementById('splash');if(!s)return;var done=0,seen=0;
try{seen=sessionStorage.getItem('sp')}catch(e){}
if(seen){if(s.parentNode)s.parentNode.removeChild(s);return}
try{sessionStorage.setItem('sp','1')}catch(e){}
function hide(){if(done)return;done=1;var w=Math.max(0,1600-Math.round(performance.now()));setTimeout(function(){s.classList.add('out');setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},500)},w)}
if(document.readyState=='complete')hide();else window.addEventListener('load',hide);
setTimeout(hide,1600);})();
</script>
