# Uji otomatis tiap push / pull request: build bundel lalu jalankan smoke test (jsdom). Tidak menyentuh pembuatan APK.
name: Test
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node build.js
      - run: npm test
